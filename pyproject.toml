[project]
name = "claude-code-hooks-herald"
version = "0.5.0-dev"
description = "Audio notification hooks for Claude Code with Notion integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yeee", email = "yeee@example.com"},
]
keywords = ["claude-code", "hooks", "audio", "notifications", "notion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
herald-notion = "herald.notion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".claude/herald"]

[tool.hatch.build.targets.sdist]
include = [".claude/"]

[tool.pytest.ini_options]
testpaths = [".claude/herald/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]
